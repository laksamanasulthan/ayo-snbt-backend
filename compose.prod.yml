name: ayo-snbt-prod

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ayosnbt
    volumes:
      # PG 18+ images need the mount at /var/lib/postgresql (versioned subdirs)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ayosnbt"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    restart: unless-stopped

  # ── Application replicas (scale-out: docker compose up -d --scale api=4) ──
  api:
    image: ${REGISTRY}/ayo-snbt-backend:${TAG}
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/ayosnbt
      DIRECT_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ayosnbt
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://mongo:27017/ayosnbt_chat
      S3_ENDPOINT: ${S3_ENDPOINT_INTERNAL}
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ${REGISTRY}/ayo-snbt-backend:${TAG}
    command: ["node", "dist/worker.js"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/ayosnbt
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://mongo:27017/ayosnbt_chat
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  haproxy:
    image: haproxy:2.9-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  mongodata:
  miniodata: