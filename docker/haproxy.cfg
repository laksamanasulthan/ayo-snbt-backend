# HAProxy — production L7 load balancer for Ayo-SNBT API replicas
# TLS termination at the edge (or Cloudflare); WS upgrade pass-through.
global
  maxconn 50000
  log stdout format raw local0 info

defaults
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout tunnel 1h          # WebSocket long-lived connections
  option httpchk GET /health
  http-check expect status 200
  option forwardfor

frontend http-in
  bind *:80
  # Stats on :8404 (bind 127.0.0.1 in production or behind auth)
  stats enable
  stats uri /haproxy-stats
  stats refresh 5s
  stats admin if LOCALHOST
  # Global rate limit: first line of defense (per IP, 1 minute window)
  stick-table type ip size 200k expire 1m store http_req_rate(1m)
  http-request track-sc0 src
  http-request deny deny_status 429 if { sc_http_req_rate(0) gt 200 }
  default_backend api

backend api
  balance roundrobin
  server api1 api:3000 check inter 5s fall 3 rise 2
  server api2 api:3000 check inter 5s fall 3 rise 2