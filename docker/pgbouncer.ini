[databases]
ayosnbt = host=postgres port=5432 dbname=ayosnbt

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

# Transaction pooling: right for Fastify + Drizzle (short transactions).
# The app uses statement_cache_size=0 (unnamed prepared statements).
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 40
min_pool_size = 5
reserve_pool_size = 5
server_reset_query = DISCARD ALL
application_name_add_host = 0
log_connections = 0
log_disconnections = 0

[users]
ayosnbt = "ayosnbt"
